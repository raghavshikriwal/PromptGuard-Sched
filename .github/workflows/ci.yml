name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.7.4
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install CPU-only deps for type-check
        # CI has no GPU and doesn't need the CUDA torch build just to type-check.
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install mypy==1.13.0
      - run: mypy src eval

  test:
    name: Test (pytest, unit + integration)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promptguard
          POSTGRES_PASSWORD: promptguard
          POSTGRES_DB: promptguard_sched_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://promptguard:promptguard@localhost:5432/promptguard_sched_test
      LLM_MODEL_IDS: mock
      LLM_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install CPU-only deps
        # No GPU on GitHub-hosted runners. LLM-backed / GPU-bound tests are
        # excluded via the `slow` marker below — run those on self-hosted
        # runners or manually before merging anything touching src/llm.
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Unit + integration tests
        run: pytest -m "not slow" --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      defense: ${{ steps.filter.outputs.defense }}
    steps:
      - uses: actions/checkout@v4
      # `github.event.pull_request.changed_files` is a *count*, not a list of
      # paths, so `contains()` on it never matches. A paths filter does.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            defense:
              - 'src/guard/**'
              - 'src/llm/**'
              - 'src/anomaly/**'
              - 'eval/attacks/**'
              - 'tests/adversarial_regression/**'

  adversarial-regression:
    name: Adversarial regression (payload library)
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Runs on PRs touching the defense/attack paths so payload-library
    # regressions can't merge silently (blueprint §15).
    if: needs.changes.outputs.defense == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      # --no-cov: the coverage gate applies to the full suite, not this subset.
      - run: pytest tests/adversarial_regression -m adversarial --no-cov

  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
