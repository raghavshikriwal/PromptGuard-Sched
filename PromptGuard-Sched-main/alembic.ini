[alembic]
# Migration scripts live under db/migrations, not the default ./alembic —
# keeps everything DB-related under db/ per the repo layout in README §4.
script_location = db/migrations

# Timestamped, sequential revision filenames make `git log db/migrations/versions/`
# read as a chronological schema history instead of requiring `alembic history`
# just to know what order things happened in.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is deliberately NOT set here — db/migrations/env.py reads
# it from src.config.get_settings().database_url instead, so one place
# (.env / DATABASE_URL) controls the DB for the app, tests, and migrations
# alike. Never hardcode a connection string in this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S